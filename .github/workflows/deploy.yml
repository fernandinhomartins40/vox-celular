name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VPS_HOST: 72.60.10.108
  VPS_USER: root
  APP_ROOT: /opt/voxcelular
  DEPLOY_PORT: "3096"
  PRIMARY_DOMAIN: voxcelular.com.br
  SECONDARY_DOMAIN: www.voxcelular.com.br
  CANONICAL_URL: https://www.voxcelular.com.br
  SSL_EMAIL: admin@voxcelular.com.br
  SITE_NAME: voxcelular
  SSH_OPTS: -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=20

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    environment:
      name: production
      url: https://www.voxcelular.com.br

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release version
        id: release
        run: echo "version=$(git rev-parse --short HEAD)-$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Verify VPS password access
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          if [ -z "${SSHPASS:-}" ]; then
            echo "GitHub secret VPS_PASSWORD is empty or missing." >&2
            exit 1
          fi

          if ! sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "echo SSH password authentication OK"; then
            echo "::error::SSH password authentication failed." >&2
            exit 1
          fi

      - name: Upload source to VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          RELEASE_DIR="${{ env.APP_ROOT }}/releases/${{ steps.release.outputs.version }}"
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "mkdir -p '$RELEASE_DIR'"

          tar \
            --exclude=.git \
            --exclude=.claude \
            --exclude=node_modules \
            --exclude=.turbo \
            --exclude=dist \
            --exclude=apps/api/node_modules \
            --exclude=apps/api/dist \
            --exclude=apps/web/node_modules \
            --exclude=apps/web/dist \
            -czf - . | \
            sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
              "tar -xzf - -C '$RELEASE_DIR'"

      - name: Prepare VPS runtime
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "bash -s" <<'ENDSSH'
            set -euo pipefail

            export DEBIAN_FRONTEND=noninteractive
            APT_UPDATED=0

            apt_update_once() {
              if [ "$APT_UPDATED" -eq 0 ]; then
                apt-get update
                APT_UPDATED=1
              fi
            }

            ensure_apt_packages() {
              local missing=0
              local pkg
              for pkg in "$@"; do
                if ! dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q 'install ok installed'; then
                  missing=1
                  break
                fi
              done
              if [ "$missing" -eq 1 ]; then
                apt_update_once
                apt-get install -y --no-install-recommends "$@"
              fi
            }

            ensure_apt_packages ca-certificates certbot curl nginx openssl tar util-linux

            if ! command -v docker >/dev/null 2>&1; then
              apt_update_once
              apt-get install -y --no-install-recommends docker.io
            fi

            if ! docker compose version >/dev/null 2>&1; then
              apt_update_once
              apt-get install -y --no-install-recommends docker-compose-v2 || \
              apt-get install -y --no-install-recommends docker-compose-plugin
            fi

            systemctl enable --now docker
            systemctl enable --now nginx

            docker compose version >/dev/null
            nginx -v >/dev/null 2>&1
            certbot --version >/dev/null
          ENDSSH

      - name: Ensure .env exists on VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "APP_ROOT='${{ env.APP_ROOT }}' CANONICAL_URL='${{ env.CANONICAL_URL }}' DEPLOY_PORT='${{ env.DEPLOY_PORT }}' PRIMARY_DOMAIN='${{ env.PRIMARY_DOMAIN }}' SECONDARY_DOMAIN='${{ env.SECONDARY_DOMAIN }}' bash -s" <<'ENDSSH'
            set -euo pipefail

            ENV_FILE="$APP_ROOT/.env"
            mkdir -p "$APP_ROOT"
            touch "$ENV_FILE"
            chmod 600 "$ENV_FILE"

            get_env() {
              local key="$1"
              awk -F= -v key="$key" '$1 == key { sub(/^[^=]*=/, "", $0); print $0; exit }' "$ENV_FILE"
            }

            upsert_env() {
              local key="$1"
              local value="$2"
              local tmp_file
              tmp_file="$(mktemp)"
              awk -v key="$key" -v value="$value" '
                BEGIN { updated = 0 }
                index($0, key "=") == 1 { print key "=" value; updated = 1; next }
                { print }
                END { if (!updated) print key "=" value }
              ' "$ENV_FILE" > "$tmp_file"
              mv "$tmp_file" "$ENV_FILE"
            }

            ensure_env() {
              local key="$1"
              local default_value="$2"
              local current_value
              current_value="$(get_env "$key" | tr -d '\r')"
              if [ -z "$current_value" ]; then
                upsert_env "$key" "$default_value"
              fi
            }

            ensure_random_hex() {
              local key="$1"
              local bytes="$2"
              local current_value
              current_value="$(get_env "$key" | tr -d '\r')"
              if [ -z "$current_value" ]; then
                upsert_env "$key" "$(openssl rand -hex "$bytes")"
              fi
            }

            # PostgreSQL — generate once, never overwrite
            ensure_env     "POSTGRES_USER"     "vox"
            ensure_env     "POSTGRES_DB"       "voxcelular"
            ensure_random_hex "POSTGRES_PASSWORD" 32
            ensure_random_hex "JWT_SECRET"        32

            # Runtime config — always reflect current deploy
            upsert_env "NODE_ENV"      "production"
            upsert_env "PORT"          "3001"
            upsert_env "DEPLOY_PORT"   "$DEPLOY_PORT"
            upsert_env "VITE_API_URL"  "/api"
            upsert_env "CORS_ORIGIN"   "$CANONICAL_URL"

            # Build DATABASE_URL from generated credentials
            POSTGRES_USER_VALUE="$(get_env "POSTGRES_USER"     | tr -d '\r')"
            POSTGRES_PASSWORD_VALUE="$(get_env "POSTGRES_PASSWORD" | tr -d '\r')"
            POSTGRES_DB_VALUE="$(get_env "POSTGRES_DB"         | tr -d '\r')"
            upsert_env "DATABASE_URL" \
              "postgresql://${POSTGRES_USER_VALUE}:${POSTGRES_PASSWORD_VALUE}@db:5432/${POSTGRES_DB_VALUE}"

            chmod 600 "$ENV_FILE"
            echo "ENV file ready at $ENV_FILE"
          ENDSSH

      - name: Deploy on VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "APP_ROOT='${{ env.APP_ROOT }}' RELEASE='${{ steps.release.outputs.version }}' DEPLOY_PORT='${{ env.DEPLOY_PORT }}' \
             bash '${{ env.APP_ROOT }}/releases/${{ steps.release.outputs.version }}/.github/scripts/remote-deploy.sh'"

      - name: Configure Nginx (HTTP)
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "DEPLOY_PORT='${{ env.DEPLOY_PORT }}' PRIMARY_DOMAIN='${{ env.PRIMARY_DOMAIN }}' SECONDARY_DOMAIN='${{ env.SECONDARY_DOMAIN }}' SITE_NAME='${{ env.SITE_NAME }}' bash -s" <<'ENDSSH'
            set -euo pipefail

            mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled /var/www/certbot
            {
              printf '%s\n' 'server {'
              printf '%s\n' '    listen 80;'
              printf '%s\n' "    server_name ${PRIMARY_DOMAIN} ${SECONDARY_DOMAIN};"
              printf '%s\n' ''
              printf '%s\n' '    location /.well-known/acme-challenge/ {'
              printf '%s\n' '        root /var/www/certbot;'
              printf '%s\n' '    }'
              printf '%s\n' ''
              printf '%s\n' '    location / {'
              printf '%s\n' "        proxy_pass http://127.0.0.1:${DEPLOY_PORT};"
              printf '%s\n' '        proxy_http_version 1.1;'
              printf '%s\n' '        proxy_set_header Upgrade $http_upgrade;'
              printf '%s\n' '        proxy_set_header Connection "upgrade";'
              printf '%s\n' '        proxy_set_header Host $host;'
              printf '%s\n' '        proxy_set_header X-Real-IP $remote_addr;'
              printf '%s\n' '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;'
              printf '%s\n' '        proxy_set_header X-Forwarded-Proto $scheme;'
              printf '%s\n' '        proxy_read_timeout 86400;'
              printf '%s\n' '    }'
              printf '%s\n' '}'
            } > "/etc/nginx/sites-available/${SITE_NAME}"

            ln -sf "/etc/nginx/sites-available/${SITE_NAME}" "/etc/nginx/sites-enabled/${SITE_NAME}"

            # Remove default site if it conflicts
            rm -f /etc/nginx/sites-enabled/default

            nginx -t
            systemctl reload nginx
            echo "Nginx HTTP config applied"
          ENDSSH

      - name: Obtain SSL certificate
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "PRIMARY_DOMAIN='${{ env.PRIMARY_DOMAIN }}' SECONDARY_DOMAIN='${{ env.SECONDARY_DOMAIN }}' SSL_EMAIL='${{ env.SSL_EMAIL }}' bash -s" <<'ENDSSH'
            set -euo pipefail

            mkdir -p /var/www/certbot
            pkill -f certbot 2>/dev/null || true
            sleep 2

            if [ ! -f "/etc/letsencrypt/live/${PRIMARY_DOMAIN}/fullchain.pem" ]; then
              if ! certbot certonly --webroot \
                -w /var/www/certbot \
                -d "$PRIMARY_DOMAIN" \
                -d "$SECONDARY_DOMAIN" \
                --email "$SSL_EMAIL" \
                --agree-tos \
                --non-interactive; then
                echo "Warning: certbot failed, keeping HTTP-only config for this deploy" >&2
              fi
            else
              echo "Certificate already exists, skipping issuance"
              certbot renew --quiet --no-random-sleep-on-renew || true
            fi
          ENDSSH

      - name: Configure Nginx (HTTPS)
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "DEPLOY_PORT='${{ env.DEPLOY_PORT }}' PRIMARY_DOMAIN='${{ env.PRIMARY_DOMAIN }}' SECONDARY_DOMAIN='${{ env.SECONDARY_DOMAIN }}' CANONICAL_URL='${{ env.CANONICAL_URL }}' SITE_NAME='${{ env.SITE_NAME }}' bash -s" <<'ENDSSH'
            set -euo pipefail

            if [ ! -f "/etc/letsencrypt/live/${PRIMARY_DOMAIN}/fullchain.pem" ]; then
              echo "SSL cert not found, keeping HTTP-only config"
              exit 0
            fi

            {
              # HTTP → redirect to canonical HTTPS www
              printf '%s\n' 'server {'
              printf '%s\n' '    listen 80;'
              printf '%s\n' "    server_name ${PRIMARY_DOMAIN} ${SECONDARY_DOMAIN};"
              printf '%s\n' "    return 301 ${CANONICAL_URL}\$request_uri;"
              printf '%s\n' '}'
              printf '%s\n' ''
              # HTTPS
              printf '%s\n' 'server {'
              printf '%s\n' '    listen 443 ssl http2;'
              printf '%s\n' "    server_name ${PRIMARY_DOMAIN} ${SECONDARY_DOMAIN};"
              printf '%s\n' ''
              printf '%s\n' "    ssl_certificate     /etc/letsencrypt/live/${PRIMARY_DOMAIN}/fullchain.pem;"
              printf '%s\n' "    ssl_certificate_key /etc/letsencrypt/live/${PRIMARY_DOMAIN}/privkey.pem;"
              printf '%s\n' '    ssl_protocols TLSv1.2 TLSv1.3;'
              printf '%s\n' '    ssl_ciphers HIGH:!aNULL:!MD5;'
              printf '%s\n' '    ssl_prefer_server_ciphers on;'
              printf '%s\n' ''
              printf '%s\n' '    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;'
              printf '%s\n' '    add_header X-Frame-Options "SAMEORIGIN" always;'
              printf '%s\n' '    add_header X-Content-Type-Options "nosniff" always;'
              printf '%s\n' ''
              printf '%s\n' '    location / {'
              printf '%s\n' "        proxy_pass http://127.0.0.1:${DEPLOY_PORT};"
              printf '%s\n' '        proxy_http_version 1.1;'
              printf '%s\n' '        proxy_set_header Upgrade $http_upgrade;'
              printf '%s\n' '        proxy_set_header Connection "upgrade";'
              printf '%s\n' '        proxy_set_header Host $host;'
              printf '%s\n' '        proxy_set_header X-Real-IP $remote_addr;'
              printf '%s\n' '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;'
              printf '%s\n' '        proxy_set_header X-Forwarded-Proto $scheme;'
              printf '%s\n' '        proxy_read_timeout 86400;'
              printf '%s\n' '    }'
              printf '%s\n' '}'
            } > "/etc/nginx/sites-available/${SITE_NAME}"

            nginx -t
            systemctl reload nginx
            echo "Nginx HTTPS config applied"
          ENDSSH

      - name: Post-deploy health check
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "APP_ROOT='${{ env.APP_ROOT }}' DEPLOY_PORT='${{ env.DEPLOY_PORT }}' RELEASE='${{ steps.release.outputs.version }}' \
             bash '${{ env.APP_ROOT }}/releases/${{ steps.release.outputs.version }}/.github/scripts/remote-health-check.sh'"

      - name: Notify success
        run: |
          echo "Deployment ${{ steps.release.outputs.version }} completed successfully"
          echo "URL: ${{ env.CANONICAL_URL }}"
