name: Build and Deploy Production

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'PROTOCOLO_*.md'
  workflow_dispatch:
    inputs:
      create_test_admin:
        description: 'Create non-destructive test operator access'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: voxcelular-production
  cancel-in-progress: false

env:
  VPS_HOST: 72.60.10.108
  VPS_USER: root
  APP_ROOT: /opt/voxcelular
  DEPLOY_PORT: "3196"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.names.outputs.registry }}
      release: ${{ steps.names.outputs.release }}
    steps:
      - id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "registry=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "release=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  build-api:
    name: Build API and migration image on GitHub
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.api.outputs.digest }}
      migration: ${{ steps.migration.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          platforms: linux/amd64
          push: true
          tags: ${{ needs.prepare.outputs.registry }}-api:${{ needs.prepare.outputs.release }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=vox-api
          cache-to: type=gha,mode=max,scope=vox-api
      - id: migration
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          platforms: linux/amd64
          push: true
          tags: ${{ needs.prepare.outputs.registry }}-migration:${{ needs.prepare.outputs.release }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=vox-api
          cache-to: type=gha,mode=max,scope=vox-api

  build-web:
    name: Build frontend on GitHub (parallel with API)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      web: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ needs.prepare.outputs.registry }}-web:${{ needs.prepare.outputs.release }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: VITE_API_URL=/api
          cache-from: type=gha,scope=vox-web
          cache-to: type=gha,mode=max,scope=vox-web

  verify:
    name: Test production images with real PostgreSQL
    needs: [prepare, build-api, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      API_IMAGE: ${{ needs.prepare.outputs.registry }}-api@${{ needs.build-api.outputs.api }}
      WEB_IMAGE: ${{ needs.prepare.outputs.registry }}-web@${{ needs.build-web.outputs.web }}
      MIGRATION_IMAGE: ${{ needs.prepare.outputs.registry }}-migration@${{ needs.build-api.outputs.migration }}
      POSTGRES_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-signing-secret-at-least-32-characters
      DEPLOY_PORT: "3196"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify scripts and configuration
        run: |
          bash -n .github/scripts/remote-deploy.sh
          bash -n .github/scripts/remote-health-check.sh
          bash -n .github/scripts/configure-host.sh
          docker compose config --quiet
          docker pull mirror.gcr.io/library/postgres:16-alpine
          docker tag mirror.gcr.io/library/postgres:16-alpine postgres:16-alpine
          docker compose --profile tools pull --policy missing
      - name: Migrations, bootstrap, authentication, uploads, persistence and resource smoke test
        run: node .github/scripts/test-runtime.mjs
      - name: Product search and customer contact regression tests
        run: node --test apps/web/src/lib/catalog.test.js
      - name: Product flows in Chromium against real API and PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/vox-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/vox-browser/node_modules/.bin/playwright" install --with-deps chromium
          node .github/scripts/test-product-browser.mjs
      - name: Container status on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=80 api web
      - name: Remove isolated CI containers and temporary test volumes
        if: always()
        run: docker compose --profile tools down --volumes

  deploy:
    name: Pull immutable GHCR images on VPS
    if: github.ref == 'refs/heads/main'
    needs: [prepare, build-api, build-web, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://www.voxcelular.com.br
    env:
      RELEASE: ${{ needs.prepare.outputs.release }}
      API_IMAGE: ${{ needs.prepare.outputs.registry }}-api@${{ needs.build-api.outputs.api }}
      WEB_IMAGE: ${{ needs.prepare.outputs.registry }}-web@${{ needs.build-web.outputs.web }}
      MIGRATION_IMAGE: ${{ needs.prepare.outputs.registry }}-migration@${{ needs.build-api.outputs.migration }}
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare authenticated SSH transport
        run: |
          test -n "$SSHPASS" || { echo 'Missing GitHub secret VPS_PASSWORD.' >&2; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cp .github/ssh_known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vox-deploy
              HostName $VPS_HOST
              User $VPS_USER
              StrictHostKeyChecking yes
              UserKnownHostsFile ~/.ssh/known_hosts
              PreferredAuthentications password
              PubkeyAuthentication no
              NumberOfPasswordPrompts 1
              ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config
          sshpass -e ssh vox-deploy 'command -v docker && docker compose version && command -v nginx && command -v certbot'
      - name: Transfer operational files only (no source, dependencies or builds)
        run: |
          printf 'API_IMAGE=%s\nWEB_IMAGE=%s\nMIGRATION_IMAGE=%s\n' "$API_IMAGE" "$WEB_IMAGE" "$MIGRATION_IMAGE" > release.env
          sshpass -e ssh vox-deploy "mkdir -p '$APP_ROOT/releases/$RELEASE'"
          tar -czf - docker-compose.yml release.env .github/scripts/remote-deploy.sh .github/scripts/remote-health-check.sh .github/scripts/configure-host.sh |
            sshpass -e ssh vox-deploy "tar -xzf - -C '$APP_ROOT/releases/$RELEASE'"
      - name: Deploy from GHCR, migrate once and verify health
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          CREATE_TEST_ADMIN: ${{ inputs.create_test_admin && 'true' || 'false' }}
        run: |
          printf '%s\n' "$REGISTRY_TOKEN" |
            sshpass -e ssh vox-deploy "APP_ROOT='$APP_ROOT' RELEASE='$RELEASE' DEPLOY_PORT='$DEPLOY_PORT' GHCR_USER='$REGISTRY_USER' CREATE_TEST_ADMIN='$CREATE_TEST_ADMIN' bash '$APP_ROOT/releases/$RELEASE/.github/scripts/remote-deploy.sh'"
