name: Build and Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_android_test:
        description: 'Build standalone Android APK with test signing (not for store publication)'
        type: boolean
        default: false
      build_ios_simulator:
        description: 'Build iOS simulator app without distribution signing'
        type: boolean
        default: false
      create_test_admin:
        description: 'Create non-destructive test operator access'
        type: boolean
        default: false
      seed_demo_data:
        description: 'Create additive fictional demo data (preserve existing records)'
        type: boolean
        default: false
      publish_demo_catalog:
        description: 'Publish the existing demo catalog with local generated product photos'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: voxcelular-production
  cancel-in-progress: false

env:
  VPS_HOST: 72.60.10.108
  VPS_USER: root
  APP_ROOT: /opt/voxcelular
  DEPLOY_PORT: "3196"
  EXPO_PUBLIC_EXPO_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EXPO_PROJECT_ID }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.names.outputs.registry }}
      release: ${{ steps.names.outputs.release }}
    steps:
      - id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "registry=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "release=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  build-api:
    name: Build API and migration image on GitHub
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.api.outputs.digest }}
      migration: ${{ steps.migration.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          platforms: linux/amd64
          push: true
          tags: ${{ needs.prepare.outputs.registry }}-api:${{ needs.prepare.outputs.release }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=vox-api
          cache-to: type=gha,mode=max,scope=vox-api
      - id: migration
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          platforms: linux/amd64
          push: true
          tags: ${{ needs.prepare.outputs.registry }}-migration:${{ needs.prepare.outputs.release }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=vox-api
          cache-to: type=gha,mode=max,scope=vox-api

  build-web:
    name: Build frontend on GitHub (parallel with API)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      web: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ needs.prepare.outputs.registry }}-web:${{ needs.prepare.outputs.release }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: VITE_API_URL=/api
          cache-from: type=gha,scope=vox-web
          cache-to: type=gha,mode=max,scope=vox-web

  verify-mobile:
    name: Validate native Android and iOS bundles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install only native workspace dependencies
        run: npm ci --workspace=@vox/mobile --include-workspace-root=false --no-audit --no-fund
      - name: Validate TypeScript
        run: npm run typecheck --workspace=@vox/mobile
      - name: Validate native session races
        run: node .github/scripts/test-mobile-session-races.mjs
      - name: Validate persistent native checkout
        run: node .github/scripts/test-mobile-cart.mjs
      - name: Native order contact link safety
        run: node .github/scripts/test-mobile-contact.mjs
      - name: Native account export and temporary file cleanup
        run: node .github/scripts/test-mobile-export.mjs
      - name: Native push consent and permission registration
        run: node .github/scripts/test-native-push-registration.mjs
      - name: Native notification destination safety
        run: node .github/scripts/test-native-notification-destination.mjs
      - name: Validate bounded offline catalog
        run: node .github/scripts/test-mobile-offline-catalog.mjs
      - name: Validate offline operator guides
        run: node .github/scripts/test-mobile-offline-guides.mjs
      - name: Validate incoming native links
        run: node .github/scripts/test-mobile-links.mjs
      - name: Validate app identifiers and HTTPS link configuration
        run: node .github/scripts/test-mobile-config.mjs
      - name: Validate optional native build configuration
        run: node .github/scripts/test-mobile-firebase.mjs
      - name: Validate persistent reward redemption
        run: node .github/scripts/test-mobile-rewards.mjs
      - name: Check Expo dependency compatibility
        working-directory: apps/mobile
        run: npx expo install --check
      - name: Export Android and iOS bundles without signing
        working-directory: apps/mobile
        run: npx expo export --platform all --max-workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: vox-native-bundles
          path: apps/mobile/dist
          retention-days: 7

  build-android-test:
    name: Build standalone Android test APK
    if: github.event_name == 'workflow_dispatch' && inputs.build_android_test
    needs: verify-mobile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://www.voxcelular.com.br/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install native workspace
        run: npm ci --workspace=@vox/mobile --include-workspace-root=false --no-audit --no-fund
      - name: Prepare optional Android Firebase client configuration
        env:
          VOX_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.VOX_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: node .github/scripts/prepare-mobile-firebase.mjs
      - name: Generate Android project from Expo configuration
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build APK with embedded bundle and template test signing
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Verify APK exists and record checksum
        working-directory: apps/mobile/android
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: vox-android-test-${{ github.sha }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary Firebase configuration
        if: always()
        run: rm -f apps/mobile/.native-config/google-services.json

  build-ios-simulator:
    name: Build iOS simulator application
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios_simulator
    needs: verify-mobile
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://www.voxcelular.com.br/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Record Xcode and SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Install native workspace
        run: npm ci --workspace=@vox/mobile --include-workspace-root=false --no-audit --no-fund
      - name: Generate iOS project and install pods
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios
      - name: Compile simulator application with embedded bundle
        run: python3 .github/scripts/build-ios-simulator.py
      - uses: actions/upload-artifact@v4
        with:
          name: vox-ios-simulator-${{ github.sha }}
          path: apps/mobile/ios/build/vox-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Test production images with real PostgreSQL
    needs: [prepare, build-api, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      API_IMAGE: ${{ needs.prepare.outputs.registry }}-api@${{ needs.build-api.outputs.api }}
      WEB_IMAGE: ${{ needs.prepare.outputs.registry }}-web@${{ needs.build-web.outputs.web }}
      MIGRATION_IMAGE: ${{ needs.prepare.outputs.registry }}-migration@${{ needs.build-api.outputs.migration }}
      POSTGRES_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-signing-secret-at-least-32-characters
      DEPLOY_PORT: "3196"
      CORS_ORIGIN: http://127.0.0.1:3196
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify scripts and configuration
        run: |
          bash -n .github/scripts/remote-deploy.sh
          bash -n .github/scripts/remote-health-check.sh
          bash -n .github/scripts/configure-host.sh
          docker compose config --quiet
          docker pull mirror.gcr.io/library/postgres:16-alpine
          docker tag mirror.gcr.io/library/postgres:16-alpine postgres:16-alpine
          docker compose --profile tools pull --policy missing
      - name: Migrations, bootstrap, authentication, uploads, persistence and resource smoke test
        run: node .github/scripts/test-runtime.mjs
      - name: Image conversion, dimensions and validation
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/imageStorage.test.js
      - name: Authentication abuse limits and bounded memory
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/authLimits.test.js
      - name: Password policy and bcrypt UTF-8 boundaries
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/passwordPolicy.test.js
      - name: Official web origins and spoofed origin rejection
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/webOrigins.test.js
      - name: Structured catalog data and source validation
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/productAttributes.test.js
      - name: Recommendation catalog constraints and unknown attributes
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/recommendations.test.js
      - name: AI provider privacy and bounded output validation
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/aiProvider.test.js
      - name: Notification retention boundaries
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/notificationRetention.test.js
      - name: Notification retry limits and expiry
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/notificationRetry.test.js
      - name: Web push subscription endpoint validation
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/pushSubscription.test.js
      - name: Persistent VAPID key generation and recovery
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/vapidKeys.test.js
      - name: Encrypted web push transport and bounded network handling
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/webPushTransport.test.js
      - name: Durable push delivery outcome policy
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/notificationDeliveryOutcome.test.js
      - name: Notification processing consent and failure boundaries
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/notificationProcessor.test.js
      - name: Native push send and provider receipt boundaries
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/nativePushTransport.test.js
      - name: Serialized notification worker and graceful shutdown
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/notificationWorker.test.js
      - name: Notification retention with disposable PostgreSQL
        run: docker compose --profile tools run --rm --no-deps -e CI=true -e NOTICE_RETENTION_TEST=ci-disposable migrate node dist/lib/notificationRetention.integration.test.js
      - name: Verify push delivery claims in disposable PostgreSQL
        run: docker compose --profile tools run --rm --no-deps -e CI=true -e PUSH_DELIVERY_TEST=ci-disposable migrate node dist/lib/notificationDeliveryClaim.integration.test.js
      - name: Bounded AI selection cache
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/aiCache.test.js
      - name: Credential vault recovery and tenant context
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/credentialVault.test.js
      - name: AI cost rounding and budget reservation boundaries
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/aiCost.test.js
      - name: AI call orchestration and conservative failure accounting
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/aiRecommendation.test.js
      - name: AI budget concurrency with real PostgreSQL
        run: docker compose --profile tools run --rm --no-deps -e CI=true -e AI_BUDGET_TEST=ci-disposable migrate node dist/lib/aiBudget.test.js
      - name: Official operator sources and editorial guide validation
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/operatorGuides.test.js
      - name: Public mobile domain association documents
        run: docker compose --profile tools run --rm --no-deps migrate node dist/lib/mobileAssociation.test.js
      - name: Account recovery token boundaries
        run: |
          docker compose --profile tools run --rm --no-deps migrate node dist/lib/accountToken.test.js
          docker compose --profile tools run --rm --no-deps migrate node dist/lib/accountMail.test.js
          docker compose --profile tools run --rm --no-deps migrate node dist/lib/accountMailTransport.test.js
          docker compose --profile tools run --rm --no-deps migrate node dist/lib/accountMailDelivery.test.js
      - name: Product search and customer contact regression tests
        run: node --test apps/web/src/lib/catalog.test.js apps/web/src/lib/panel.test.js apps/web/src/lib/aiMoney.test.js
      - name: Product flows in Chromium against real API and PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/vox-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/vox-browser/node_modules/.bin/playwright" install --with-deps chromium
          node .github/scripts/test-product-browser.mjs
      - name: AI merchant configuration in mobile tablet and desktop
        run: node .github/scripts/test-ai-config-browser.mjs
      - name: Customer notices and safe destinations
        run: node .github/scripts/test-notices-browser.mjs
      - name: Shared customer and merchant panels at mobile, tablet and desktop sizes
        run: node .github/scripts/test-panels-browser.mjs
      - name: PWA installation resources and safe offline behavior
        run: node .github/scripts/test-pwa-browser.mjs
      - name: Installed PWA navigation avoids marketing landing
        run: node .github/scripts/test-pwa-entry-browser.mjs
      - name: PWA update without interrupting active pages
        run: node .github/scripts/test-pwa-update-browser.mjs
      - name: Bounded public catalogue offline
        run: |
          node .github/scripts/test-web-offline-catalog.mjs
          node .github/scripts/test-web-offline-guides.mjs
          node .github/scripts/test-web-offline-catalog-browser.mjs
      - name: Push worker privacy and safe notification destinations
        run: node .github/scripts/test-push-worker.mjs
      - name: Browser push consent and explicit permission flow
        run: node .github/scripts/test-browser-push.mjs
      - name: Logout push capture and session boundaries
        run: node .github/scripts/test-logout-push.mjs
      - name: Push account panel at mobile tablet and desktop sizes
        run: node .github/scripts/test-push-panel-browser.mjs
      - name: Favorites, comparison and current cart prices
        run: node .github/scripts/test-favorites-browser.mjs
      - name: Customer privacy choices and data download
        run: node .github/scripts/test-privacy-browser.mjs
      - name: Customer account closure request responsive form
        run: node .github/scripts/test-account-closure-browser.mjs
      - name: Merchant account closure analysis responsive flow
        run: node .github/scripts/test-closure-analysis-browser.mjs
      - name: Product compatibility detail navigation
        run: node .github/scripts/test-product-compatibility-browser.mjs
      - name: Merchant product compatibility editor
        run: node .github/scripts/test-compatibility-editor-browser.mjs
      - name: Public editorial news responsive reading
        run: node .github/scripts/test-news-browser.mjs
      - name: Merchant editorial drafts and publication editor
        run: node .github/scripts/test-news-editor-browser.mjs
      - name: Customer service quote decisions
        run: node .github/scripts/test-service-quotes-browser.mjs
      - name: Customer service schedule changes
        run: node .github/scripts/test-service-schedule-browser.mjs
      - name: Assistant compatible accessory purchases
        run: node .github/scripts/test-assistant-accessories-browser.mjs
      - name: Cart purchase journey
        run: node .github/scripts/test-cart-browser.mjs
      - name: Account confirmation browser privacy and flows
        run: |
          node .github/scripts/test-account-confirmation-browser.mjs
          node .github/scripts/test-account-requests-browser.mjs
      - name: Merchant service quote issuance and retry
        run: node .github/scripts/test-merchant-quotes-browser.mjs
      - name: Verify session renewal races
        run: node .github/scripts/test-session-races.mjs
      - name: Three-step product selection on mobile, tablet and desktop
        run: node .github/scripts/test-assistant-browser.mjs
      - name: Three-step official operator help
        run: node .github/scripts/test-help-browser.mjs
      - name: Landing page editor and faithful live previews
        run: node .github/scripts/test-landing-editor.mjs
      - name: Container status on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=80 api web
      - name: Remove isolated CI containers and temporary test volumes
        if: always()
        run: docker compose --profile tools down --volumes

  deploy:
    name: Pull immutable GHCR images on VPS
    if: github.ref == 'refs/heads/main'
    needs: [prepare, build-api, build-web, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://www.voxcelular.com.br
    env:
      RELEASE: ${{ needs.prepare.outputs.release }}
      API_IMAGE: ${{ needs.prepare.outputs.registry }}-api@${{ needs.build-api.outputs.api }}
      WEB_IMAGE: ${{ needs.prepare.outputs.registry }}-web@${{ needs.build-web.outputs.web }}
      MIGRATION_IMAGE: ${{ needs.prepare.outputs.registry }}-migration@${{ needs.build-api.outputs.migration }}
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare authenticated SSH transport
        run: |
          test -n "$SSHPASS" || { echo 'Missing GitHub secret VPS_PASSWORD.' >&2; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cp .github/ssh_known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vox-deploy
              HostName $VPS_HOST
              User $VPS_USER
              StrictHostKeyChecking yes
              UserKnownHostsFile ~/.ssh/known_hosts
              PreferredAuthentications password
              PubkeyAuthentication no
              NumberOfPasswordPrompts 1
              ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config
          sshpass -e ssh vox-deploy 'command -v docker && docker compose version && command -v nginx && command -v certbot'
      - name: Transfer operational files only (no source, dependencies or builds)
        run: |
          printf 'API_IMAGE=%s\nWEB_IMAGE=%s\nMIGRATION_IMAGE=%s\n' "$API_IMAGE" "$WEB_IMAGE" "$MIGRATION_IMAGE" > release.env
          sshpass -e ssh vox-deploy "mkdir -p '$APP_ROOT/releases/$RELEASE'"
          tar -czf - docker-compose.yml release.env .github/scripts/remote-deploy.sh .github/scripts/remote-health-check.sh .github/scripts/configure-host.sh |
            sshpass -e ssh vox-deploy "tar -xzf - -C '$APP_ROOT/releases/$RELEASE'"
      - name: Deploy from GHCR, migrate once and verify health
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          CREATE_TEST_ADMIN: ${{ inputs.create_test_admin && 'true' || 'false' }}
          SEED_DEMO_DATA: ${{ inputs.seed_demo_data && 'true' || 'false' }}
          PUBLISH_DEMO_CATALOG: ${{ inputs.publish_demo_catalog && 'true' || 'false' }}
        run: |
          printf '%s\n' "$REGISTRY_TOKEN" |
            sshpass -e ssh vox-deploy "APP_ROOT='$APP_ROOT' RELEASE='$RELEASE' DEPLOY_PORT='$DEPLOY_PORT' GHCR_USER='$REGISTRY_USER' CREATE_TEST_ADMIN='$CREATE_TEST_ADMIN' SEED_DEMO_DATA='$SEED_DEMO_DATA' PUBLISH_DEMO_CATALOG='$PUBLISH_DEMO_CATALOG' bash '$APP_ROOT/releases/$RELEASE/.github/scripts/remote-deploy.sh'"
