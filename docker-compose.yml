name: voxcelular

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: vox_db
    restart: unless-stopped
    mem_limit: ${DB_MEMORY_LIMIT:-512m}
    cpus: ${DB_CPU_LIMIT:-1.0}
    pids_limit: 128
    shm_size: 128m
    logging: *logging
    environment:
      POSTGRES_USER: vox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: voxcelular
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB"]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [vox-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vox -d voxcelular"]
      interval: 15s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s

  api:
    image: ${API_IMAGE:?API_IMAGE required}
    container_name: vox_api
    restart: unless-stopped
    init: true
    mem_limit: ${API_MEMORY_LIMIT:-768m}
    cpus: ${API_CPU_LIMIT:-1.0}
    pids_limit: 128
    logging: *logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment: &api-env
      DATABASE_URL: postgresql://vox:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/voxcelular?connection_limit=${DB_POOL_SIZE:-5}&pool_timeout=20
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      PORT: "3001"
      CORS_ORIGIN: ${CORS_ORIGIN:-https://www.voxcelular.com.br}
      PUBLIC_STORE_KEY: ${PUBLIC_STORE_KEY:-vox-celular}
      UPLOADS_DIR: /app/uploads
      MARKETPLACE_KEY_FILE: /app/secrets/marketplace.key
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-true}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-${CORS_ORIGIN:-https://www.voxcelular.com.br}}
      NODE_ENV: production
    volumes: [uploads:/app/uploads, secrets:/app/secrets]
    networks: [vox-net]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE required}
    container_name: vox_web
    restart: unless-stopped
    mem_limit: ${WEB_MEMORY_LIMIT:-64m}
    cpus: ${WEB_CPU_LIMIT:-0.5}
    pids_limit: 64
    logging: *logging
    ports: ["127.0.0.1:${DEPLOY_PORT:-3196}:80"]
    networks: [vox-net]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  migrate:
    image: ${MIGRATION_IMAGE:?MIGRATION_IMAGE required}
    profiles: [tools]
    restart: "no"
    init: true
    mem_limit: ${MIGRATION_MEMORY_LIMIT:-512m}
    cpus: "1.0"
    pids_limit: 128
    logging: *logging
    environment: *api-env
    volumes: [uploads:/app/uploads]
    networks: [vox-net]
    depends_on:
      db: {condition: service_healthy}

networks:
  vox-net:
    driver: bridge

volumes:
  secrets:
    name: voxcelular_secrets
  pgdata:
    name: voxcelular_pgdata
  uploads:
    name: voxcelular_uploads
